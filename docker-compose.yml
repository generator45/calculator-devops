# Calculator stack: two API replicas behind an Nginx reverse proxy / load balancer.
#
#   docker compose up -d --build     # bring up the whole stack
#   curl localhost:8080/api/v1/add?a=2&b=3
#
# The API replicas deliberately publish no host ports - all traffic enters
# through the proxy, which is what makes the two replicas useful.

name: calculator-stack

services:
  calculator:
    image: ${DOCKER_IMAGE:-jayeshpandit/calculator-api}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      APP_NAME: calculator
      APP_VERSION: ${IMAGE_TAG:-latest}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
    expose:
      - "8080"
    networks:
      - calculator-net
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  proxy:
    image: nginx:1.27-alpine
    container_name: calculator-proxy
    depends_on:
      calculator:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calculator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  calculator-net:
    name: calculator-net
    driver: bridge
