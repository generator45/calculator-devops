spring:
  application:
    name: ${APP_NAME:calculator}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Calculator REST API
    course: CSE 816 - Software Production Engineering
    version: ${APP_VERSION:1.0.0}

logging:
  level:
    com.iiitb.spe.calculator: ${LOG_LEVEL:INFO}
