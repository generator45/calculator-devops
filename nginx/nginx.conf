# Reverse proxy / load balancer in front of the calculator replicas.
#
# "calculator" resolves via Docker's embedded DNS (127.0.0.11) to one A record
# per replica. An `upstream` block would resolve that name once at config load,
# so after a redeploy gave the replicas new IPs the proxy would keep dialling
# the dead ones and serve 502s until it was restarted by hand. Passing the
# target through a variable instead forces a re-resolution on every request,
# honouring the TTL below, so replicas can come and go freely.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Proxy's own liveness endpoint - used by the Compose health check
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "proxy ok\n";
    }

    location / {
        # Variable target => resolved at request time, not at startup
        set $backend "http://calculator:8080";
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Re-resolve and retry if the replica we picked is gone or unhealthy
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
