# Reverse proxy / load balancer in front of the calculator replicas.
# "calculator" resolves via Docker's embedded DNS to every replica's IP, so
# the resolver below lets Nginx pick up replicas that come and go on redeploy.

upstream calculator_backend {
    server calculator:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Proxy's own liveness endpoint - used by the Compose health check
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "proxy ok\n";
    }

    location / {
        proxy_pass http://calculator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Retry the other replica if one instance is unhealthy
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
